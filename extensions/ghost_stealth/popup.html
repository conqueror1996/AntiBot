<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ghost Sovereignty Console</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Space+Mono&display=swap" rel="stylesheet">
</head>
<body>
  <div class="glass-container">
    <!-- Header -->
    <header>
      <div class="logo-area">
        <span class="logo-symbol">🔱</span>
        <h1>GHOST SOVEREIGNTY</h1>
      </div>
      <div class="status-indicator">
        <span class="status-dot green"></span>
        <span class="status-text">ACTIVE</span>
      </div>
    </header>

    <!-- Main Container -->
    <main class="simple-layout">
      
      <!-- 1. Connection Status Card -->
      <div class="card glass status-card">
        <div class="status-row">
          <span class="label">Website:</span>
          <span class="value" id="session-host">Detecting...</span>
        </div>
        <div class="status-row">
          <span class="label">Session Status:</span>
          <span class="value badge green" id="session-status">SYNCED</span>
        </div>
      </div>

      <!-- 2. One-Click Toggles -->
      <div class="card glass toggles-card">
        <div class="toggle-group">
          <label class="toggle-switch">
            <input type="checkbox" id="stealth-toggle" checked>
            <span class="slider"></span>
          </label>
          <span class="toggle-label">Stealth Protection (Anti-Block)</span>
        </div>
      </div>

      <!-- 3. Proxy Configuration Card -->
      <div class="card glass proxy-card">
        <div class="proxy-header" id="btn-toggle-proxy-panel">
          <h3>Bright Data Proxy Settings</h3>
          <span class="arrow-indicator">▼</span>
        </div>
        
        <div class="proxy-content hidden" id="proxy-settings-panel">
          <div class="toggle-group" style="margin-bottom: 8px;">
            <label class="toggle-switch">
              <input type="checkbox" id="proxy-enable-toggle">
              <span class="slider"></span>
            </label>
            <span class="toggle-label">Route Traffic Through Proxy</span>
          </div>

          <div class="input-row">
            <div class="input-group">
              <label for="proxy-host">Host / IP</label>
              <input type="text" id="proxy-host" placeholder="zproxy.lum-superproxy.io">
            </div>
            <div class="input-group" style="flex: 0 0 80px;">
              <label for="proxy-port">Port</label>
              <input type="number" id="proxy-port" value="22225">
            </div>
          </div>

          <div class="input-row">
            <div class="input-group">
              <label for="proxy-user">Username</label>
              <input type="text" id="proxy-user" placeholder="lum-customer-...">
            </div>
            <div class="input-group">
              <label for="proxy-pass">Password</label>
              <input type="password" id="proxy-pass" placeholder="Password">
            </div>
          </div>

          <button class="action-btn small" id="btn-save-proxy" style="width: 100%; text-align: center; margin-top: 6px;">
            Apply Proxy Settings
          </button>
        </div>
      </div>

      <!-- 4. Action Control Card -->
      <div class="card glass action-card">
        <h3>Action Configuration</h3>
        
        <div class="input-group">
          <label for="strike-type">Select Action</label>
          <select id="strike-type">
            <option value="quantum">Deposit Test</option>
            <option value="promo">Promo Claim Test</option>
            <option value="withdraw">Withdrawal Test</option>
          </select>
        </div>

        <div class="input-group">
          <label for="amount-input">Amount (₹)</label>
          <input type="number" id="amount-input" value="5000">
        </div>

        <div class="input-group" id="hash-wrapper">
          <label for="hash-input">DNA Transaction Hash</label>
          <input type="text" id="hash-input" placeholder="Paste transaction hash here">
        </div>

        <div class="input-group">
          <label for="intensity-preset">Speed / Intensity</label>
          <select id="intensity-preset">
            <option value="safe">Safe (Slow, Human-like)</option>
            <option value="medium" selected>Balanced (Medium Speed)</option>
            <option value="fast">Aggressive (Fast)</option>
          </select>
        </div>

        <button class="trigger-btn" id="btn-fire-strike">
          <span class="btn-glow"></span>
          <span class="btn-text">START ACTION</span>
        </button>
      </div>

      <!-- 5. Real-time Status Log -->
      <div class="card glass compact-log-card">
        <div class="console-box" id="log-feed">
          <div class="log-entry system">[READY] Waiting for action...</div>
        </div>
      </div>

    </main>
  </div>
  <script src="popup.js"></script>
</body>
</html>
